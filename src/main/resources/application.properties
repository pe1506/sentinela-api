spring.application.name=sentinela-api
server.port=8080

# Banco H2 em arquivo (pasta ./data). Os dados continuam lá depois de reiniciar a API.
spring.datasource.url=jdbc:h2:file:./data/sentinela
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console web do banco: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/sentinela, usuário sa, sem senha)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
